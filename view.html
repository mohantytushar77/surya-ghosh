<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AfterSchool Academy</title>
<!-- BUILD: academy-v18 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#071528;--bg-2:#0B1F38;--surface:#0E2743;--surface-2:#123052;
  --line:rgba(198,218,244,.16);--line-strong:rgba(198,218,244,.28);
  --ink:#EEF4FC;--ink-2:#9FB4CE;--accent:#4C8DFF;--accent-soft:#8FB8FF;
  --accent-ink:#04101F;--ok:#5FD3A6;--r:14px;
}
[data-theme="light"]{
  --bg:#FFFFFF;--bg-2:#F4F7FC;--surface:#FFFFFF;--surface-2:#F4F7FC;
  --line:rgba(11,31,58,.12);--line-strong:rgba(11,31,58,.22);
  --ink:#0B1F3A;--ink-2:#5C7089;--accent:#1B57C4;--accent-soft:#4C8DFF;
  --accent-ink:#FFFFFF;--ok:#0E7A56;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  font-size:16.5px;line-height:1.7;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
h1,h2,h3,.price{font-family:'Sora',system-ui,sans-serif;letter-spacing:-.03em}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
#scrollRail{position:fixed;top:0;left:0;height:2px;z-index:80;width:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent-soft));transform:scaleX(0);transform-origin:0 50%}
header{background:#071528!important;color:#EEF4FC;border-bottom:1px solid rgba(198,218,244,.16)!important}
header .logo,header .back{color:#EEF4FC}
header .iconbtn{color:#EEF4FC;border-color:rgba(198,218,244,.24)}
header .sunmark::after{background:#071528}
.spark-wrap{background:#071528;padding:0 0 18px}
.spark{display:block;max-width:820px;margin:0 auto;padding:0 26px;height:44px;overflow:visible}
.spark path{fill:none;stroke:#6BA1FF;stroke-width:2;stroke-linecap:round;stroke-dasharray:1400;stroke-dashoffset:1400;
  animation:draw 1.9s cubic-bezier(.2,.8,.2,1) .3s forwards}
.spark circle{fill:#6BA1FF;opacity:0;animation:fadeDot .6s 1.9s forwards, pulseDot 2.6s 2.4s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeDot{to{opacity:1}}
@keyframes pulseDot{0%,100%{r:4}50%{r:6.5}}
.cover{animation:coverIn .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes coverIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
h1{animation:coverIn .7s cubic-bezier(.2,.8,.2,1) .1s both}
.block,.factbar,.video{animation:coverIn .7s cubic-bezier(.2,.8,.2,1) .2s both}
.fact{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.factbar{perspective:700px;transform-style:preserve-3d}
.fact:hover{transform:translateZ(16px) translateY(-2px)}
.cta{position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);
  transform:skewX(-18deg);transition:left .6s cubic-bezier(.4,0,.2,1)}
.cta:hover::after{left:130%}
header{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 84%,transparent);
  backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{max-width:820px;margin:0 auto;padding:0 26px;height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Sora',sans-serif;font-weight:600;font-size:16px}
.sunmark{width:26px;height:26px;border-radius:50%;position:relative;background:conic-gradient(from 180deg,var(--accent),var(--accent-soft),var(--accent))}
.sunmark::after{content:"";position:absolute;left:2px;right:2px;bottom:2px;height:46%;background:var(--bg);border-radius:0 0 13px 13px}
.logo small{display:block;font-family:'Manrope',sans-serif;font-weight:500;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.tools{display:flex;gap:9px;align-items:center}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;
  color:var(--ink);cursor:pointer;display:grid;place-items:center;font-size:14px;transition:border-color .2s}
.iconbtn:hover{border-color:var(--accent)}
.back{font-size:14px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;transition:color .2s,gap .2s}
.back:hover{color:var(--accent);gap:11px}
main{max-width:820px;margin:0 auto;padding:44px 26px 90px}
.cover{width:100%;aspect-ratio:16/7;object-fit:cover;border-radius:var(--r);border:1px solid var(--line);margin-bottom:30px;display:block}
.kicker{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);padding:5px 12px;border-radius:999px}
h1{font-size:clamp(28px,4.4vw,46px);font-weight:600;line-height:1.1;margin:16px 0 12px}
.byline{font-size:14px;color:var(--ink-2);font-weight:500;margin-bottom:26px}
.lede{font-size:19px;color:var(--ink-2);padding-left:18px;border-left:2px solid var(--accent);margin-bottom:30px}
.content p{margin-bottom:18px;color:var(--ink-2)}
.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);margin:26px 0;background:var(--surface-2)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.factbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:28px 0}
.fact{background:var(--surface);padding:16px 18px}
.fact b{display:block;font-family:'Sora',sans-serif;font-size:17px;font-weight:600}
.fact span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;margin:26px 0}
.block h2{font-size:19px;font-weight:600;margin-bottom:12px}
.block p{color:var(--ink-2);font-size:16px}
.cta{display:inline-flex;align-items:center;gap:9px;padding:14px 28px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;
  border:none;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 8px 24px -12px var(--accent)}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px var(--accent)}
/* comments */
.comments{margin-top:44px;border-top:1px solid var(--line);padding-top:30px}
.c-title{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:16px}
.c-list{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.c-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 17px}
.c-item b{font-family:'Sora',sans-serif;font-size:13.5px;font-weight:600}
.c-when{font-size:11.5px;color:var(--ink-2);margin-left:8px}
.c-item p{font-size:15px;line-height:1.6;margin-top:4px;color:var(--ink-2)}
.c-empty{font-size:14.5px;color:var(--ink-2)}
textarea,input[type=text]{width:100%;border:1px solid var(--line-strong);border-radius:10px;background:var(--bg);
  color:var(--ink);font-family:'Manrope',sans-serif;font-size:15.5px;padding:13px 15px;resize:vertical;transition:border-color .2s,box-shadow .2s}
textarea:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
::placeholder{color:var(--ink-2);opacity:.75}
.c-row{display:flex;gap:9px;margin-top:9px}
.c-row input{flex:1}
.c-post{border:none;border-radius:999px;padding:12px 24px;background:var(--accent);color:var(--accent-ink);
  font-family:'Manrope',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;transition:transform .18s}
.c-post:hover{transform:translateY(-1px)}
.c-note{font-size:12px;color:var(--ink-2);margin-top:9px}
.loading,.error{color:var(--ink-2);padding:50px 0;text-align:center}
@media (max-width:640px){main{padding:30px 20px 70px}.block{padding:20px}.c-row{flex-direction:column}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}#scrollRail{display:none}}
</style>
</head>
<body>
<div id="scrollRail" aria-hidden="true"></div>
<header>
  <div class="nav">
    <a class="logo" href="index.html"><span class="sunmark"></span><span>AfterSchool<small>Academy</small></span></a>
    <div class="tools">
      <a class="back" href="index.html" id="backLink">← Back</a>
      <a class="back" href="login.html">My dashboard</a>
      <button class="iconbtn" id="themeToggle" aria-label="Switch to dark mode" title="Switch to dark mode">☀️</button>
    </div>
  </div>
</header>
<div class="spark-wrap"><svg class="spark" viewBox="0 0 1000 44" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0,36 L140,30 L280,38 L420,20 L560,26 L700,12 L840,17 L1000,4"/><circle cx="1000" cy="4" r="4"/>
</svg></div>
<main id="main"><p class="loading">Loading…</p></main>

<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('themeToggle');
  try{var s=localStorage.getItem('asa-theme'); if(s) root.setAttribute('data-theme',s);}catch(e){}
  function paint(){var d=root.getAttribute('data-theme')==='dark';btn.textContent=d?'🌙':'☀️';
    var l=d?'Switch to light mode':'Switch to dark mode';btn.setAttribute('aria-label',l);btn.setAttribute('title',l);}
  paint();
  btn.addEventListener('click',function(){var d=root.getAttribute('data-theme')==='dark';
    root.setAttribute('data-theme',d?'light':'dark');
    try{localStorage.setItem('asa-theme',d?'light':'dark');}catch(e){} paint();});
  var rail=document.getElementById('scrollRail'),t=false;
  addEventListener('scroll',function(){if(t)return;t=true;requestAnimationFrame(function(){
    var m=document.documentElement.scrollHeight-innerHeight;
    rail.style.transform='scaleX('+(m>0?scrollY/m:0)+')';t=false;});},{passive:true});
})();
</script>
<script src="./transitions.js" defer></script>
<script>window.__cfgLoaded=false;</script>
<script src="./firebase-config.js" onload="window.__cfgLoaded=true" onerror="window.__cfg404=true"></script>
<script>
/* Accept every reasonable way the config might have been written */
(function(){
  var c = window.SFF_CONFIG || window.firebaseConfig || window.FIREBASE_CONFIG || null;
  if(c && c.apiKey) { window.SFF_CONFIG = c; return; }
  window.__cfgProblem = window.__cfg404 ? 'notfound'
    : (window.__cfgLoaded ? 'wrongvar' : 'notfound');
})();
</script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const cfg = window.SFF_CONFIG || {};
const main = document.getElementById('main');
const params = new URLSearchParams(location.search);
const type = params.get('type');   // courses | books | posts
const id   = params.get('id');
const VALID = ['courses','books','posts'];
const SECTION = { courses:'#learn', books:'#books', posts:'#blog' };
const BACKTEXT = { courses:'← All courses', books:'← All summaries', posts:'← All posts' };

const esc = t => { const d=document.createElement('div'); d.textContent=t==null?'':t; return d.innerHTML; };
const nl  = t => esc(t).replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');
const toEmbed = u => {
  if(!u) return '';
  u=String(u).trim();
  let m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
  if(m) return 'https://www.youtube.com/embed/'+m[1];
  m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m) return 'https://player.vimeo.com/video/'+m[1];
  return '';
};

if(type && SECTION[type]){
  const b=document.getElementById('backLink');
  b.href='index.html'+SECTION[type];
  b.textContent=BACKTEXT[type];
}

if(!VALID.includes(type) || !id){
  main.innerHTML='<p class="error">Nothing to show here. <a href="index.html" style="color:var(--accent)">Return to the homepage</a>.</p>';
} else if(!cfg.apiKey){
  main.innerHTML='<p class="error">'+(window.__cfgProblem==='wrongvar'
    ? 'firebase-config.js loaded, but its first line must be <code>window.SFF_CONFIG = {</code> — not <code>const firebaseConfig = {</code>.'
    : 'firebase-config.js was not found next to this page.')+'</p>';
} else {
  const app=initializeApp(cfg), db=getFirestore(app);
  try{
    const snap=await getDoc(doc(db,type,id));
    if(!snap.exists()){
      main.innerHTML='<p class="error">This item no longer exists. <a href="index.html" style="color:var(--accent)">Return to the homepage</a>.</p>';
    } else {
      const data=snap.data();
      render(data);
      watchComments(db);
      if(type==='courses') gateCourse(db,data);
    }
  }catch(err){
    console.error(err);
    main.innerHTML='<p class="error">Could not load: '+esc(err.code||err.message)+'</p>';
  }

  function render(v){
    document.title = (v.title||'AfterSchool Academy')+' — AfterSchool Academy';
    const cover = v.coverUrl ? `<img class="cover" src="${esc(v.coverUrl)}" alt="" onerror="this.style.display='none'">` : '';
    const when  = v.createdAt&&v.createdAt.toDate ? v.createdAt.toDate().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}) : '';
    let body='';

    if(type==='posts'){
      body = `${cover}
        ${v.tag?`<span class="kicker">${esc(v.tag)}</span>`:''}
        <h1>${esc(v.title)}</h1>
        <p class="byline">By Surya Ghosh${when?' · '+when:''}</p>
        ${v.excerpt?`<p class="lede">${esc(v.excerpt)}</p>`:''}
        <div class="content"><p>${nl(v.body)}</p></div>`;
    }
    else if(type==='books'){
      body = `${cover}
        <span class="kicker">Book summary</span>
        <h1>${esc(v.title)}</h1>
        <p class="byline">${esc(v.author||'')}${when?' · added '+when:''}</p>
        <div class="content"><p>${nl(v.summary)}</p></div>
        ${v.takeaways?`<div class="block"><h2>Key takeaways</h2><p>${nl(v.takeaways)}</p></div>`:''}`;
    }
    else {
      body = `${cover}
        ${v.level?`<span class="kicker">${esc(v.level)}</span>`:''}
        <h1>${esc(v.title)}</h1>
        <p class="byline">Taught by Surya Ghosh${when?' · added '+when:''}</p>
        ${v.summary?`<p class="lede">${esc(v.summary)}</p>`:''}
        <div id="lessonZone"><div class="block"><h2>Checking your access…</h2></div></div>
        <div class="factbar">
          ${v.price?`<div class="fact"><b>${esc(v.price)}</b><span>Price</span></div>`:''}
          ${v.duration?`<div class="fact"><b>${esc(v.duration)}</b><span>Length</span></div>`:''}
          ${v.level?`<div class="fact"><b>${esc(v.level)}</b><span>Level</span></div>`:''}
        </div>
        `;
    }

    main.innerHTML = body + `
      <section class="comments">
        <p class="c-title">Comments</p>
        <div class="c-list" id="cList"><p class="c-empty">Loading comments…</p></div>
        <textarea id="cText" rows="3" placeholder="Share a thought or a question…"></textarea>
        <div class="c-row">
          <input id="cName" type="text" placeholder="Name (optional)">
          <button class="c-post" id="cPost" type="button">Post comment</button>
        </div>
        <p class="c-note">Be kind. Never share personal financial details. Moderated by Surya.</p>
      </section>`;

    document.getElementById('cPost').addEventListener('click',async ()=>{
      const txt=document.getElementById('cText').value.trim();
      if(!txt) return;
      const btn=document.getElementById('cPost'); btn.disabled=true;
      try{
        await addDoc(collection(db,type,id,'comments'),{
          text:txt.slice(0,590),
          name:document.getElementById('cName').value.trim().slice(0,55),
          qtext:String(v.title||'').slice(0,90),
          createdAt:serverTimestamp()
        });
        document.getElementById('cText').value='';
      }catch(err){ alert('Could not post: '+(err.code||err.message)); }
      btn.disabled=false;
    });
  }


  /* ---------- Paid-course gate ----------
     The lesson lives in courses/{id}/private/lesson and the database rules
     only release it to enrolled students, so this cannot be bypassed. */
  function gateCourse(db,v){
    const auth=getAuth();
    onAuthStateChanged(auth, async user=>{
      const zone=document.getElementById('lessonZone');
      if(!zone) return;

      if(!user){
        zone.innerHTML=`<div class="block">
          <h2>🔒 This course is for enrolled students</h2>
          <p>Sign in to check your access, or enrol to start learning. Blog posts, book summaries and Ask Surya remain free for everyone.</p>
          <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
            <a class="cta" href="login.html">Sign in / Create account</a>
            ${v.enrolUrl?`<a class="cta" style="background:transparent;color:var(--ink);border:1px solid var(--line-strong);box-shadow:none" href="${esc(v.enrolUrl)}" target="_blank" rel="noopener">Enrol · ${esc(v.price||'')}</a>`:''}
          </div></div>`;
        return;
      }

      try{
        const snap=await getDoc(doc(db,'courses',id,'private','lesson'));
        const p=snap.exists()?snap.data():{};
        const embed=toEmbed(p.videoUrl);
        zone.innerHTML=`
          <div class="block" style="border-color:color-mix(in srgb,var(--ok) 40%,transparent)">
            <h2>✓ You have access to this course</h2>
            <p>Welcome back${user.displayName?', '+esc(user.displayName.split(' ')[0]):''}. Pick up where you left off.</p>
          </div>
          ${embed?`<div class="video"><iframe src="${embed}" title="${esc(v.title)}" loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`:''}
          ${p.content?`<div class="block"><h2>Lesson</h2><p>${nl(p.content)}</p></div>`:''}`;
      }catch(err){
        zone.innerHTML=`<div class="block">
          <h2>🔒 Not enrolled yet</h2>
          <p>You are signed in, but this course has not been unlocked for your account. After payment, Surya grants access and it appears here straight away.</p>
          <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
            ${v.enrolUrl?`<a class="cta" href="${esc(v.enrolUrl)}" target="_blank" rel="noopener">Enrol · ${esc(v.price||'')}</a>`:''}
            <a class="cta" style="background:transparent;color:var(--ink);border:1px solid var(--line-strong);box-shadow:none" href="login.html">My dashboard</a>
          </div></div>`;
      }
    });
  }

  function watchComments(db){
    onSnapshot(query(collection(db,type,id,'comments'),orderBy('createdAt','asc')),snap=>{
      const list=document.getElementById('cList'); if(!list) return;
      list.innerHTML = snap.empty
        ? '<p class="c-empty">No comments yet — be the first.</p>'
        : snap.docs.map(d=>{
            const c=d.data();
            const w=c.createdAt&&c.createdAt.toDate?c.createdAt.toDate().toLocaleDateString('en-IN'):'';
            return `<div class="c-item"><b>${esc(c.name)||'Anonymous'}</b><span class="c-when">${w}</span><p>${esc(c.text)}</p></div>`;
          }).join('');
    },err=>{
      const list=document.getElementById('cList');
      if(list) list.innerHTML='<p class="c-empty">Comments unavailable: '+esc(err.code||'')+'</p>';
    });
  }
}
</script>
</body>
</html>
